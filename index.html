<!DOCTYPE html>
<html lang="en">
<head>

<title>Yes, Chef!</title>
<link rel="manifest" href="manifest.json">

</head>
<body>

 <path d="M30 92 L90 92 M36 86 L44 96 M84 86 L76 96" stroke="#3a3f44" stroke-width="2.4" stroke-linecap="round"/>
 <circle class="fs fs0" r="1"/><circle class="fs fs1" r="1"/><circle class="fs fs2" r="1"/><circle class="fs fs3" r="1"/><circle class="fs fs4" r="1"/>
</g>
<g class="shaker salt" transform="translate(16 30)"><g class="shk">

<g class="shaker pep" transform="translate(104 30)"><g class="shk">

 <path d="M-7 -6 Q0 -16 7 -6 Z" fill="url(#cap)"/><circle cx="-2" cy="-9" r=".9" fill="#222"/><circle cx="2" cy="-9" r=".9" fill="#222"/><circle cx="0" cy="-12" r=".9" fill="#222"/>

<g transform="translate(60 44)">
 <g transform="rotate(-38)"><g class="k1"><g class="kmove">
  <path d="M0 -4 L46 -3 Q58 -1 62 3 L0 4 Z" fill="url(#blade)" stroke="#5d656c" stroke-width=".6"/>

 <g transform="rotate(218) scale(1 -1)"><g class="k2"><g class="kmove">
  <path d="M0 -4 L46 -3 Q58 -1 62 3 L0 4 Z" fill="url(#blade)" stroke="#5d656c" stroke-width=".6"/>
  <path d="M2 -1.2 L50 -.6" stroke="#fff" stroke-opacity=".7" stroke-width=".8"/>
  <rect x="-4" y="-5" width="4" height="10" rx="1" fill="#9aa2a9"/>
  <rect x="-28" y="-4.5" width="24" height="9" rx="4" fill="url(#handle)"/>
  <circle cx="-22" cy="0" r="1.3" fill="#d9dde1"/><circle cx="-11" cy="0" r="1.3" fill="#d9dde1"/></g></g></g>
 <g class="ksparks"><circle class="ks ks0" r="1.3"/><circle class="ks ks1" r="1.3"/><circle class="ks ks2" r="1.3"/><circle class="ks ks3" r="1.3"/><circle class="ks ks4" r="1.3"/><circle class="ks ks5" r="1.3"/><circle class="ks ks6" r="1.3"/><circle class="ks ks7" r="1.3"/></g>
</g>
</svg></div>
    <h1>Yes, Chef!</h1>
  </div>
  <button class="hbtn" id="btnNew" aria-label="New recipe">➕</button>
  <button class="hbtn" id="btnSettings" aria-label="Settings">⚙️</button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="recipes" class="on"><span>🔪</span>Recipes</button>
  <button data-tab="match"><span>🧠</span>What Can I Make</button>
  <button data-tab="pantry"><span>🥫</span>Pantry</button>
  <button data-tab="kitchen"><span>🍳</span>Kitchen</button>
  <button data-tab="favs"><span>❤️</span>Favorites</button>
</nav>
<section class="sheet" id="detail"><div class="bar"><button class="hbtn" data-close>⬇️</button><h3 id="dTitle"></h3></div><div class="body" id="dBody"></div></section>
<section class="sheet" id="editor"><div class="bar"><button class="hbtn" data-close>✖️</button><h3 id="eTitle">New Recipe</h3><button class="btn sm" id="eSave">Save</button></div><div class="body" id="eBody"></div></section>
<section class="sheet" id="settings"><div class="bar"><button class="hbtn" data-close>⬇️</button><h3>Settings</h3></div><div class="body" id="sBody"></div></section>
<div id="timers"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<datalist id="dlIng"></datalist>
<div id="rotate"><div class="big">📱</div><h2 style="font-family:Georgia,serif;color:#ffb238;margin:0">Flip me back, Chef!</h2><div style="color:#bfae98">Yes, Chef works best in portrait mode.</div></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
